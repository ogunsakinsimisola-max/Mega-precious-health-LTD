services:
  web:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "bun install --frozen-lockfile && exec bun dev"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/').then(r=>r.text()).then(t=>{if(!t.includes('id=\"root\"'))throw 1}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
